<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - 页面未找到 | 小方小镇</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }

        .bg {
            width: 100%;
            min-height: 100vh;
            background: url('assets/background.jpg') no-repeat center center / cover;
            background-attachment: fixed;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 50px 40px;
            background: transparent;
            max-width: 500px;
            width: 100%;
            margin-top: -80px;
        }

        .code {
            font-size: 5rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 4px 40px rgba(0, 0, 0, 0.5);
            line-height: 1;
            margin-bottom: 10px;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #ffffff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
        }

        .sub {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .desc {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
            line-height: 1.6;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .footer {
            margin-top: 24px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="container">
            <div class="code">404</div>
            <div class="title">页面未找到</div>
            <div class="sub">Page not found</div>
            <div class="desc">你访问的页面可能已被删除、移动，或者根本不存在。</div>
            <div class="footer">小方小镇 · 2026</div>
        </div>
    </div>
</body>
</html>
