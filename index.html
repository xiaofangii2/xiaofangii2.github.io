<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>小方小方i的官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #0a0a0a;
        }

        .site-bg {
            width: 100%;
            min-height: 100vh;
            background: url('背景.jpg') no-repeat center center / cover;
            background-attachment: fixed;
            position: relative;
        }

        .site-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 0;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            padding: 24px 30px;
            background: transparent;
            display: flex;
            justify-content: center;
        }

        .site-title {
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.2rem, 4vw, 2.4rem);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
            margin: 0;
            line-height: 1.3;
            text-align: center;
        }

        .content {
            position: relative;
            z-index: 1;
            padding-top: 100px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -60px;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background: #7c3aed;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.35);
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 28px rgba(124, 58, 237, 0.55);
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="site-bg">
        <header class="header">
            <h1 class="site-title">小方小方i的官网</h1>
        </header>
        <div class="content">
            <a href="server.html" class="btn">了解服务器</a>
        </div>
    </div>
</body>
</html>
