<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>小方小方i的官网</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #0a0a0a;
        }

        .site-bg {
            width: 100%;
            min-height: 100vh;
            background: url('背景.jpg') no-repeat center center / cover;
            background-attachment: fixed;
            position: relative;
        }

        .site-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 0;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            padding: 24px 30px;
            background: transparent;
            display: flex;
            justify-content: center;
        }

        .site-title {
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            font-size: clamp(1.2rem, 4vw, 2.4rem);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
            margin: 0;
            line-height: 1.3;
            text-align: center;
        }

        .content {
            position: relative;
            z-index: 1;
            padding-top: 100px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -60px;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background: #7c3aed;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.35);
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 28px rgba(124, 58, 237, 0.55);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .footer-link {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px 20px 40px;
            margin-top: auto;
        }

        .footer-link a {
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: color 0.3s, transform 0.2s;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .footer-link a:hover {
            color: #c4b5fd;
            background: rgba(124, 58, 237, 0.15);
            border-color: rgba(124, 58, 237, 0.2);
            transform: scale(1.03);
        }

        .footer-link a:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="site-bg">
        <header class="header">
            <h1 class="site-title">小方小方i的官网</h1>
        </header>
        <div class="content">
            <a href="server.html" class="btn">了解服务器</a>
        </div>
        <div class="footer-link">
            <a href="https://qun.qq.com/universal-share/share?ac=1&authKey=m29KlxLO4ZIrPw%2B%2B7qoL7%2FHN0Yjdn9tn6LMNVOg8zcxJrs73kq9N8zpe1bp2cvvZ&busi_data=eyJncm91cENvZGUiOiI3NjI3MjA5MzUiLCJ0b2tlbiI6ImpDc3phS2ozVFN0YTBKRDROdnFNTUl6WUdwdnFQazNxaVJhb29HMTlWN1YyeDNjU2l3SzY5RHVoZ1F4ZlEvYVkiLCJ1aW4iOiIzODA1NzA3MTE0In0%3D&data=OAMynHIsWE6VljMeG7iFw8qYbi4Rnq6k9sD2fHO4GQPaLexMerGf-eed70qTvaGDjupr3dkz1DQOXztxRV27OA&svctype=4&tempid=h5_group_info" target="_blank" rel="noopener noreferrer">添加QQ服务器聊天群</a>
        </div>
    </div>
</body>
</html>
