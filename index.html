<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>小方小镇的官网</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            background: #0a0a0a;
        }

        .bg {
            width: 100%;
            min-height: 100vh;
            background: url('assets/background.jpg') no-repeat center center / cover;
            background-attachment: fixed;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
        }

        .verify-box {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 40px 30px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 400px;
            width: 100%;
        }

        .verify-title {
            color: #ffffff;
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .verify-sub {
            color: rgba(255, 255, 255, 0.5);
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            font-size: 0.85rem;
            text-align: center;
            line-height: 1.6;
        }

        .verify-status {
            color: rgba(255, 255, 255, 0.4);
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            font-size: 0.8rem;
            min-height: 20px;
        }

        .verify-status.passed {
            color: #a78bfa;
        }

        .cf-turnstile {
            transform: scale(0.85);
        }

        .skip-link {
            color: rgba(255, 255, 255, 0.25);
            font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
            font-size: 0.75rem;
            text-decoration: none;
            transition: color 0.3s;
            cursor: pointer;
            display: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 2px;
        }

        .skip-link:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 480px) {
            .verify-box {
                padding: 30px 20px;
                margin: 0 16px;
            }
            .cf-turnstile {
                transform: scale(0.75);
            }
            .verify-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="verify-box">
            <div class="verify-title"> 人机验证</div>
            <div class="verify-sub">请完成下方验证以进入小方小镇官网</div>
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEHAYONhdqABJeN-" data-callback="onVerify" data-theme="dark" data-size="normal"></div>
            <div class="verify-status" id="verifyStatus">等待验证…</div>
            <a href="home.html" class="skip-link" id="skipLink"> </a>
        </div>
    </div>

    <script>
        var verified = false;

        function onVerify(token) {
            verified = true;
            var statusEl = document.getElementById('verifyStatus');
            statusEl.textContent = '✅ 验证通过，正在跳转…';
            statusEl.className = 'verify-status passed';

            setTimeout(function() {
                window.location.href = 'home.html';
            }, 600);
        }

        setTimeout(function() {
            if (!verified) {
                document.getElementById('skipLink').style.display = 'inline-block';
            }
        }, 2000);
    </script>
</body>
</html>
